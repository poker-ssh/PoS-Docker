name: Docker

on:
  schedule:
    - cron: '44 2 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - '**.md'  # Ignore readme changes
      - '**.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'  # Ignore readme changes
      - '**.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: poker-ssh/poker-over-ssh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Poker-over-SSH source
        uses: actions/checkout@v4
        with:
          repository: poker-ssh/Poker-over-SSH
          path: Poker-over-SSH
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Fetch all tags and get the latest tag from the source repo
      - name: Fetch tags and get latest tag
        id: get-latest-tag
        run: |
          cd Poker-over-SSH
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # Check if tag/version/release already built
      - name: Check if tag already built
        id: check-built
        run: |
          if [ -f .last-built-tag ] && [ "$(cat .last-built-tag)" = "${{ steps.get-latest-tag.outputs.latest_tag }}" ]; then
            echo "Tag already built, skipping"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "New tag, proceeding"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      # Setup QEMU for multi-architecture builds
      - name: Set up QEMU
        if: steps.check-built.outputs.skip_build == 'false'
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx with explicit driver configuration
      - name: Set up Docker Buildx
        if: steps.check-built.outputs.skip_build == 'false'
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # Verify the builder is correctly configured
      - name: Inspect builder
        if: steps.check-built.outputs.skip_build == 'false'
        run: |
          echo "Name: ${{ steps.buildx.outputs.name }}"
          echo "Driver: ${{ steps.buildx.outputs.driver }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      # Login to registry
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.check-built.outputs.skip_build == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        if: steps.check-built.outputs.skip_build == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get-latest-tag.outputs.latest_tag }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest

      # Build and push Docker image
      - name: Build and push
        if: steps.check-built.outputs.skip_build == 'false'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install cosign for signing
      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.check-built.outputs.skip_build == 'false'
        uses: sigstore/cosign-installer@v3.3.0

      # Sign the published Docker image
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' && steps.build-and-push.outputs.digest != '' && steps.check-built.outputs.skip_build == 'false' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "Digest: ${DIGEST}"
          echo "Tags: ${TAGS}"
          if [ -n "${DIGEST}" ]; then
            echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"
          else
            echo "Digest is empty, skipping signing"
          fi

      # Update last built tag
      - name: Update last built tag
        if: steps.check-built.outputs.skip_build == 'false' && github.event_name != 'pull_request'
        run: |
          echo "${{ steps.get-latest-tag.outputs.latest_tag }}" > .last-built-tag
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .last-built-tag
          git commit -m "chore: update last built tag to ${{ steps.get-latest-tag.outputs.latest_tag }}"
          git push